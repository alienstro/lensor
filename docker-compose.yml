# Base file for the deploy. It publishes no host port: the proxy (Dokploy) routes to `web`.
# For local work, docker-compose.override.yml adds the host ports. Compose loads it by default.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lensor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lensor}
      POSTGRES_DB: lensor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://lensor:${POSTGRES_PASSWORD:-lensor}@postgres:5432/lensor
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    profiles: ["qdrant"]
    volumes:
      - qdrant:/qdrant/storage

volumes:
  pgdata:
  qdrant:
