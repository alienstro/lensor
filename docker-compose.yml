services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lensor
      POSTGRES_PASSWORD: lensor
      POSTGRES_DB: lensor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
