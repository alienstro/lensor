name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lensor
          POSTGRES_PASSWORD: lensor
          POSTGRES_DB: lensor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lensor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Tests, one file at a time
        run: for f in tests/test_*.py; do uv run pytest "$f" -q || exit 1; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
