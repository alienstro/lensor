name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lensor
          POSTGRES_PASSWORD: lensor
          POSTGRES_DB: lensor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lensor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Tests, one file at a time
        run: for f in tests/test_*.py; do uv run pytest "$f" -q || exit 1; done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests, one file at a time
        run: for f in $(find src -name "*.test.ts*"); do npx vitest run "$f" --maxWorkers=1 || exit 1; done
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
